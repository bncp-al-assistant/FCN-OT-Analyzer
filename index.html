<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCN OT 분석 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="zoneName">HENC &amp; TCN Zone · Time Sheet</div>
      <h1>TCN OT 분석 시스템</h1>
      <p class="lede">전달과 이번 달 타임시트(.xlsx)를 올리면 평일 OT와 휴일 OT를 비교하고, 휴일·평일 일수 변화와 작업자별 근무 시간대 변화가 OT에 얼마나 영향을 줬는지 나눠서 보여줍니다.</p>
    </div>
    <div class="drop" id="drop">
      <div class="drop-row">
        <strong style="font-size:.9rem">타임시트 2개를 끌어다 놓기</strong>
        <span class="sample-flag" id="sampleFlag" hidden>예시 데이터(익명)</span>
      </div>
      <div class="slots">
        <label class="slot" for="filePrev"><span class="eyebrow">전달</span><span class="mo" id="moPrev">—</span><span class="fn" id="fnPrev">파일 선택</span></label>
        <label class="slot" for="fileCur"><span class="eyebrow">이번 달</span><span class="mo" id="moCur">—</span><span class="fn" id="fnCur">파일 선택</span></label>
      </div>
      <div class="drop-row">
        <span class="muted" style="font-size:.78rem">월은 파일명·시트명에서 자동 인식해 순서를 맞춥니다.</span>
        <button type="button" class="btn ghost" id="loadSample">예시 데이터 보기</button>
        <label class="btn" for="fileBoth">파일 2개 선택</label>
      </div>
      <input type="file" id="fileBoth" accept=".xlsx,.xls,.xlsm" multiple hidden>
      <input type="file" id="filePrev" accept=".xlsx,.xls,.xlsm" hidden>
      <input type="file" id="fileCur" accept=".xlsx,.xls,.xlsm" hidden>
      <div class="err" id="err" hidden></div>
    </div>
  </header>

  <div id="out"></div>
</div>
<div id="tip" hidden></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/core.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
