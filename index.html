<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCN OT 분석 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a payroll clerk's ledger — summary strip on top, then per-worker rows that open into day-by-day timesheet strips. */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --ink: #1b2130;
  --ink-2: #4a5263;
  --ink-3: #7a8293;
  --rule: #dfe2e8;
  --rule-2: #eceef2;
  --accent: #34409c;
  --accent-soft: #e6e8f6;
  --hol: #c4561f;          /* 휴일(금요일) 식별 */
  --hol-soft: #fbe9df;
  --up: #1d7a4f;
  --down: #b3343a;
  --warn: #8a5a00; --warn-bg: #fdf1d6;
  --alert: #b3343a; --alert-bg: #fbe4e5;
  --info: #34409c; --info-bg: #e6e8f6;
  --eff-cal: #8d94a3;      /* 일수 효과 */
  --eff-pat: #6250d6;      /* 패턴 효과 */
  /* sequential: weekday OT (blue), holiday OT (orange) */
  --s0: #eef1f5; --b1: #cde2fb; --b2: #9ec5f4; --b3: #5598e7; --b4: #256abf; --b5: #104281;
  --o1: #fbd9c6; --o2: #f5ae86; --o3: #eb6834; --o4: #b8461a;
  --cell-ink-dark: #ffffff;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151c; --panel: #1a1e27; --ink: #e9ebf0; --ink-2: #b4bac6; --ink-3: #868d9b; --rule: #2d3340; --rule-2: #232833;
  --accent: #9aa4f0; --accent-soft: #262c4a; --hol: #f08a52; --hol-soft: #3a2519;
  --up: #4cc38a; --down: #f07a7f; --warn: #f0c060; --warn-bg: #3a2f14; --alert: #f07a7f; --alert-bg: #3d1f22; --info: #9aa4f0; --info-bg: #262c4a;
  --eff-cal: #6f7686; --eff-pat: #9085e9;
  --s0: #222733; --b1: #1c3a63; --b2: #184f95; --b3: #2a78d6; --b4: #5598e7; --b5: #9ec5f4;
  --o1: #4a2a18; --o2: #8a3d17; --o3: #d95926; --o4: #f5ae86; --cell-ink-dark: #0f1218;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12151c; --panel: #1a1e27; --ink: #e9ebf0; --ink-2: #b4bac6; --ink-3: #868d9b; --rule: #2d3340; --rule-2: #232833;
  --accent: #9aa4f0; --accent-soft: #262c4a; --hol: #f08a52; --hol-soft: #3a2519;
  --up: #4cc38a; --down: #f07a7f; --warn: #f0c060; --warn-bg: #3a2f14; --alert: #f07a7f; --alert-bg: #3d1f22; --info: #9aa4f0; --info-bg: #262c4a;
  --eff-cal: #6f7686; --eff-pat: #9085e9;
  --s0: #222733; --b1: #1c3a63; --b2: #184f95; --b3: #2a78d6; --b4: #5598e7; --b5: #9ec5f4;
  --o1: #4a2a18; --o2: #8a3d17; --o3: #d95926; --o4: #f5ae86; --cell-ink-dark: #0f1218;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.55; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 28px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.12rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 600; }
.eyebrow { font-family: var(--font-num); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
p { margin: 0; }

/* header + upload */
header.top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 24px; align-items: end; }
.lede { color: var(--ink-2); max-width: 60ch; margin-top: 6px; }
.drop { border: 1.5px dashed var(--rule); border-radius: 10px; background: var(--panel); padding: 14px; display: grid; gap: 10px; transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; min-width: 0; display: grid; gap: 2px; }
.slot .fn { font-size: .78rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .mo { font-weight: 600; }
.drop-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.btn { font: inherit; font-weight: 600; font-size: .85rem; border-radius: 7px; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); padding: 7px 12px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, summary:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sample-flag { font-size: .78rem; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 2px 9px; }
.err { color: var(--alert); background: var(--alert-bg); border-radius: 8px; padding: 10px 12px; font-size: .88rem; }

/* sections */
section.block { display: grid; gap: 14px; }
.sec-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }

/* calendar compare */
.cal-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
.cal-month { padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.cal-month + .cal-month { border-left: 1px solid var(--rule); }
.cal-stats { display: flex; gap: 18px; flex-wrap: wrap; }
.cal-stats div { display: grid; }
.cal-stats b { font-family: var(--font-num); font-size: 1.35rem; font-weight: 600; }
.cal-stats .chg { font-size: .78rem; font-family: var(--font-num); }
.mini-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; max-width: 300px; }
.mini-cal span { font-family: var(--font-num); font-size: .72rem; text-align: center; padding: 3px 0; border-radius: 4px; color: var(--ink-2); }
.mini-cal .h { color: var(--ink-3); font-family: var(--font-ui); }
.mini-cal .hd { background: var(--hol-soft); color: var(--hol); font-weight: 600; }

/* KPI ledger */
.ledger { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
.ledger table { min-width: 640px; }
th, td { text-align: right; padding: 9px 12px; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-size: .74rem; font-weight: 600; color: var(--ink-3); letter-spacing: .03em; border-bottom: 1px solid var(--rule); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.d-up { color: var(--up); } .d-down { color: var(--down); } .d-0 { color: var(--ink-3); }
.sub { display: block; font-size: .74rem; color: var(--ink-3); font-family: var(--font-ui); }
.row-hol td:first-child { box-shadow: inset 3px 0 0 var(--hol); }
.row-wd td:first-child { box-shadow: inset 3px 0 0 var(--b3); }

/* findings */
.findings { display: grid; gap: 0; }
.finding { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--rule-2); }
.finding:last-child { border-bottom: 0; }
.finding p { max-width: 80ch; color: var(--ink); }
.finding p b { font-weight: 600; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.chip.alert { color: var(--alert); background: var(--alert-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.info { color: var(--info); background: var(--info-bg); }
.chip.ok { color: var(--ink-3); background: var(--rule-2); }
.chip::before { font-family: var(--font-num); }
.chip.alert::before { content: "▲"; font-size: .6rem; }
.chip.warn::before { content: "!"; }
.chip.info::before { content: "i"; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }

/* effect chart */
.tabs { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.tab { font: inherit; font-size: .82rem; font-weight: 600; padding: 6px 12px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--panel); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.chart-box { padding: 14px 16px; display: grid; gap: 10px; }
.chart-scroll { overflow-x: auto; }
svg text { font-family: var(--font-ui); }

/* worker list */
.workers { display: grid; gap: 0; }
details.w { border-bottom: 1px solid var(--rule); }
details.w:last-child { border-bottom: 0; }
details.w > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(180px, 1.6fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, .8fr) minmax(0, 1.6fr); gap: 12px; align-items: center; padding: 12px 16px; }
details.w > summary::-webkit-details-marker { display: none; }
details.w > summary:hover { background: var(--rule-2); }
details.w[open] > summary { background: var(--rule-2); }
.w-name { font-weight: 600; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.w-name .caret { font-family: var(--font-num); color: var(--ink-3); transition: transform .15s; display: inline-block; }
details[open] .w-name .caret { transform: rotate(90deg); }
.w-name small { font-weight: 400; color: var(--ink-3); font-family: var(--font-num); }
.w-metric { display: grid; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.w-metric .lab { font-family: var(--font-ui); font-size: .7rem; color: var(--ink-3); }
.w-head { display: grid; grid-template-columns: minmax(180px, 1.6fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, .8fr) minmax(0, 1.6fr); gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--rule); font-size: .74rem; font-weight: 600; color: var(--ink-3); }
.w-body { padding: 6px 16px 20px; display: grid; gap: 18px; }

/* day strips */
.strip-wrap { overflow-x: auto; }
.strip { display: grid; grid-template-columns: 74px repeat(31, minmax(22px, 1fr)); gap: 2px; min-width: 760px; align-items: stretch; }
.strip .lbl { font-size: .74rem; color: var(--ink-2); display: flex; align-items: center; font-weight: 600; }
.strip .dh { font-family: var(--font-num); font-size: .64rem; color: var(--ink-3); text-align: center; line-height: 1.2; padding-bottom: 2px; }
.strip .dh.hd { color: var(--hol); font-weight: 600; }
.cell { height: 30px; border-radius: 4px; background: var(--s0); font-family: var(--font-num); font-size: .66rem; display: flex; align-items: center; justify-content: center; color: var(--ink-2); position: relative; cursor: default; }
.cell.dev::after { content: ""; position: absolute; inset: -2px; border: 2px solid var(--eff-pat); border-radius: 5px; pointer-events: none; }
.cell.off { background: repeating-linear-gradient(135deg, var(--s0) 0 4px, var(--rule) 4px 5px); }
.cell.dark { color: var(--cell-ink-dark); }
.cell.hdc { box-shadow: inset 0 -3px 0 var(--hol); }
.strip-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .74rem; color: var(--ink-2); align-items: center; }
.ramp { display: inline-flex; gap: 2px; vertical-align: middle; margin: 0 4px; }
.ramp i { width: 14px; height: 12px; border-radius: 2px; display: inline-block; }

.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.dist { display: grid; gap: 6px; }
.dist-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 92px; gap: 8px; align-items: center; font-size: .8rem; }
.dist-row .k { font-family: var(--font-num); }
.dist-bars { display: grid; gap: 2px; }
.dist-bars i { display: block; height: 7px; border-radius: 0 3px 3px 0; min-width: 2px; }
.dist-bars i.p { background: var(--eff-cal); }
.dist-bars i.c { background: var(--accent); }
.dist-row .v { font-family: var(--font-num); text-align: right; color: var(--ink-2); font-size: .76rem; }
.checks { display: grid; gap: 6px; font-size: .84rem; }
.checks li { margin-left: 1em; }
.decomp { font-size: .85rem; color: var(--ink-2); display: grid; gap: 4px; }
.decomp b { color: var(--ink); font-family: var(--font-num); font-weight: 600; }

/* tooltip */
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .78rem; border-radius: 6px; padding: 6px 9px; max-width: 260px; line-height: 1.45; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
#tip b { font-family: var(--font-num); }

.method { font-size: .84rem; color: var(--ink-2); display: grid; gap: 6px; padding: 14px 18px; }
.method li { margin-left: 1.1em; max-width: 90ch; }
.method ul { margin: 0; padding: 0; display: grid; gap: 4px; }

@media (max-width: 860px) {
  header.top { grid-template-columns: 1fr; }
  .w-head { display: none; }
  details.w > summary { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  details.w > summary .w-name, details.w > summary .chips { grid-column: 1 / -1; }
  .two-col { grid-template-columns: 1fr; }
  .finding { grid-template-columns: 1fr; gap: 4px; }
}
@media (max-width: 560px) {
  .wrap { padding-inline: 16px; }
  .cal-grid { grid-template-columns: 1fr; }
  .cal-month + .cal-month { border-left: 0; border-top: 1px solid var(--rule); }
  .slots { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== 도구 막대 ===== */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 14px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; margin-bottom: 28px; font-size: .85rem; }
.toolbar .tb-right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
#out { display: grid; gap: 28px; }
#out > .toolbar { margin-bottom: 0; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: 0 2px 10px rgba(0,0,0,.06); }

/* ===== 보고서 (종이 한 가지 모습으로 고정: 화면·인쇄 동일) ===== */
.report {
  --p-bg: #ffffff; --p-ink: #16191f; --p-ink2: #4b5160; --p-rule: #c9ccd3; --p-head: #eef0f4; --p-acc: #2b3480; --p-up: #1d6b45; --p-dn: #a32a30; --p-flag: #f3f1fb;
  background: var(--p-bg); color: var(--p-ink); width: 100%; max-width: 210mm; margin: 0 auto; padding: 16mm 14mm; box-shadow: 0 2px 18px rgba(0,0,0,.12); border-radius: 4px;
  font-family: var(--font-ui); font-size: 10pt; line-height: 1.55; display: grid; gap: 7mm;
}
.report h1 { font-size: 17pt; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0 8px; }
.report h2 { font-size: 11.5pt; font-weight: 700; color: var(--p-acc); border-bottom: 1.5px solid var(--p-acc); padding-bottom: 3px; margin-bottom: 8px; }
.report section { break-inside: auto; }
.report section > h2 { break-after: avoid; }
.rp-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6mm; align-items: end; border-bottom: 2.5px solid var(--p-ink); padding-bottom: 5mm; }
.rp-title { min-width: 0; flex: 1 1 auto; }
.rp-sign { flex: none; }
.rp-kicker { font-family: var(--font-num); font-size: 9pt; color: var(--p-ink2); letter-spacing: .04em; }
.rp-meta { border-collapse: collapse; font-size: 9pt; }
.rp-meta th, .rp-meta td { border: 1px solid var(--p-rule); padding: 3px 8px; text-align: left; white-space: nowrap; }
.rp-meta th { background: var(--p-head); font-weight: 600; color: var(--p-ink2); }
.rp-sign { border-collapse: collapse; font-size: 9pt; }
.rp-sign th, .rp-sign td { border: 1px solid var(--p-ink2); text-align: center; padding: 2px 6px; }
.rp-sign th { background: var(--p-head); font-weight: 600; width: 19mm; }
.rp-sign th.v { width: 7mm; line-height: 1.3; }
.rp-sign td { height: 16mm; }
.rp-sample { font-size: 9pt; color: var(--p-dn); }
.rp-list { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.rp-list li { padding-left: 2px; }
.rp-list.num { list-style: none; padding-left: 0; font-size: 9pt; }
.rp-list.num li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); }
.rp-list.num .k { color: var(--p-ink2); font-family: var(--font-num); }
.rp-lab { display: inline-block; min-width: 5.5em; color: var(--p-acc); }
.rp-p { color: var(--p-ink2); }
.rp-t { border-collapse: collapse; width: 100%; font-size: 9pt; }
.rp-t th, .rp-t td { border: 1px solid var(--p-rule); padding: 3px 6px; text-align: left; white-space: normal; }
.rp-t thead th { background: var(--p-head); font-weight: 600; text-align: center; color: var(--p-ink); }
.rp-t td.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp-t td.sm, .rp-t .sm { font-size: 8pt; color: var(--p-ink2); }
.rp-t td.n.sm { white-space: normal; text-align: center; }
.rp-t .mono { font-family: var(--font-num); }
.rp-t tr { break-inside: avoid; }
.rp-t tr.grp td { background: #f7f8fa; font-weight: 600; color: var(--p-ink2); font-size: 8.5pt; }
.rp-t tr.tot td { background: var(--p-head); font-weight: 700; border-top: 1.5px solid var(--p-ink2); }
.rp-t tr.flag td { background: var(--p-flag); }
.rp-small { font-size: 8.3pt; }
.rp-small th, .rp-small td { padding: 2px 4px; }
.rp-small thead th { white-space: nowrap; }
.rp-t:not(.rp-small) { break-inside: avoid; }
.report .up { color: var(--p-up); } .report .dn { color: var(--p-dn); } .report .z { color: var(--p-ink2); }
.rp-foot { font-size: 8pt; color: var(--p-ink2); margin-top: 4px; }
.rp-op { min-height: 30mm; border: 1px solid var(--p-rule); border-radius: 2px; padding: 3mm; background-image: repeating-linear-gradient(transparent 0 7.4mm, #e6e8ec 7.4mm 7.6mm); line-height: 7.6mm; white-space: pre-wrap; }
.rp-end { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 7.5pt; color: var(--p-ink2); border-top: 1px solid var(--p-rule); padding-top: 3mm; }
.report .ed { outline: none; border-bottom: 1px dashed var(--p-acc); min-width: 4em; display: inline-block; cursor: text; }
.report .ed:focus { background: #eef0fb; }
.report .ed.empty::before { content: attr(data-ph); color: #9aa0ab; }
.report .rp-op.ed { display: block; border-bottom: 1px solid var(--p-rule); }
@media (max-width: 700px) { .report { padding: 18px 14px; } .rp-head { grid-template-columns: 1fr; } .rp-t { display: block; overflow-x: auto; } }

@page { size: A4 portrait; margin: 12mm 11mm; }
@media print {
  :root, body { background: #fff !important; color-scheme: light; }
  header.top, .toolbar, #tip { display: none !important; }
  .wrap { padding: 0 !important; max-width: none; display: block; }
  #out { display: block; }
  #report { max-width: none; width: 100%; padding: 0; margin: 0; box-shadow: none; border-radius: 0; }
  .no-print, #tip { display: none !important; }
  .report .ed { border-bottom: 0; }
  .report .ed.empty::before { content: ""; }
  .report .ed:focus { background: transparent; }
  .report .rp-op.ed { border: 1px solid var(--p-rule); }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="zoneName">HENC &amp; TCN Zone · Time Sheet</div>
      <h1>TCN OT 분석 시스템</h1>
      <p class="lede">전달과 이번 달 타임시트(.xlsx)를 올리면 평일 OT와 휴일 OT를 비교하고, 휴일·평일 일수 변화와 작업자별 근무 시간대 변화가 OT에 얼마나 영향을 줬는지 나눠서 보여줍니다.</p>
    </div>
    <div class="drop" id="drop">
      <div class="drop-row">
        <strong style="font-size:.9rem">타임시트 2개를 끌어다 놓기</strong>
        <span class="sample-flag" id="sampleFlag" hidden>예시 데이터(익명)</span>
      </div>
      <div class="slots">
        <label class="slot" for="filePrev"><span class="eyebrow">전달</span><span class="mo" id="moPrev">—</span><span class="fn" id="fnPrev">파일 선택</span></label>
        <label class="slot" for="fileCur"><span class="eyebrow">이번 달</span><span class="mo" id="moCur">—</span><span class="fn" id="fnCur">파일 선택</span></label>
      </div>
      <div class="drop-row">
        <span class="muted" style="font-size:.78rem">월은 파일명·시트명에서 자동 인식해 순서를 맞춥니다.</span>
        <button type="button" class="btn ghost" id="loadSample">예시 데이터 보기</button>
        <label class="btn" for="fileBoth">파일 2개 선택</label>
      </div>
      <input type="file" id="fileBoth" accept=".xlsx,.xls,.xlsm" multiple hidden>
      <input type="file" id="filePrev" accept=".xlsx,.xls,.xlsm" hidden>
      <input type="file" id="fileCur" accept=".xlsx,.xls,.xlsm" hidden>
      <div class="err" id="err" hidden></div>
    </div>
  </header>

  <div id="out"></div>
</div>
<div id="tip" hidden></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== Timesheet OT core (parse + compare) — pure functions, XLSX global required ===== */
var OTCore = (function () {
  var MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  var MON3 = MONTHS.map(function (m) { return m.slice(0, 3); });
  var WD_KO = ['일','월','화','수','목','금','토'];

  function norm(v) { return v == null ? '' : String(v).replace(/\s+/g, '').toUpperCase(); }
  function num(v) { if (v == null || v === '') return 0; var n = typeof v === 'number' ? v : parseFloat(v); return isFinite(n) ? n : 0; }
  function round(n, d) { var p = Math.pow(10, d == null ? 2 : d); return Math.round(n * p) / p; }
  function colLetter(c) { return XLSX.utils.encode_col(c); }

  function cell(ws, r, c) { return ws[XLSX.utils.encode_cell({ r: r, c: c })]; }
  function val(ws, r, c) { var x = cell(ws, r, c); return x ? x.v : null; }

  // Excel time (fraction of day) or "HH:MM" -> minutes since midnight; null if not a time
  function toMin(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') { if (v >= 0 && v < 1.0001) return Math.round(v * 1440) % 1440; if (v >= 1 && v < 2) return Math.round((v - 1) * 1440); return null; }
    var m = String(v).trim().match(/^(\d{1,2})[:.](\d{2})/);
    return m ? (+m[1]) * 60 + (+m[2]) : null;
  }
  function fmtMin(m) { if (m == null) return '—'; var h = Math.floor(m / 60), mm = m % 60; return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm; }

  function detectYearMonth(fileName, sheetName, monthLabel) {
    var s = (fileName + ' ' + sheetName).toLowerCase();
    var month = null, year = null;
    for (var i = 0; i < 12; i++) { if (s.indexOf(MONTHS[i]) >= 0) { month = i + 1; break; } }
    if (!month) for (i = 0; i < 12; i++) { if (new RegExp('(^|[^a-z])' + MON3[i] + '([^a-z]|$)').test(s)) { month = i + 1; break; } }
    if (!month && monthLabel) { var mm = String(monthLabel).match(/(\d{1,2})\s*월/); if (mm) month = +mm[1]; }
    var y4 = s.match(/20\d{2}/); if (y4) year = +y4[0];
    if (!year) { var y2 = s.match(/[._\-\s](\d{2})(?:\D|$)/); if (y2) year = 2000 + (+y2[1]); }
    return { year: year, month: month };
  }

  function parseWorkbook(wb, fileName) {
    var ws = wb.Sheets[wb.SheetNames[0]];
    var sheetName = wb.SheetNames[0];
    var range = XLSX.utils.decode_range(ws['!ref']);
    var maxR = range.e.r, maxC = range.e.c;
    var warnings = [];

    // header: row containing TIME / Name
    var hdrRow = -1, timeCol = -1, nameCol = -1, enCol = -1, rateCol = -1;
    for (var r = 0; r <= Math.min(12, maxR) && hdrRow < 0; r++) {
      for (var c = 0; c <= maxC; c++) {
        var t = norm(val(ws, r, c));
        if (t === 'TIME') { hdrRow = r; timeCol = c; }
      }
    }
    if (hdrRow < 0) throw new Error('TIME 열을 찾지 못했습니다. 타임시트 양식이 맞는지 확인해 주세요.');
    for (c = 0; c <= maxC; c++) {
      var h = norm(val(ws, hdrRow, c));
      if (h === 'NAME') nameCol = c;
      if (h === 'E/N') enCol = c;
      if (h.indexOf('SALARY') === 0 || h.indexOf('HOURLY') >= 0) rateCol = c;
    }
    if (nameCol < 0) nameCol = timeCol - 2;
    if (rateCol < 0) rateCol = timeCol - 1;

    // day row: first row below header with 1,2,3 in consecutive columns after TIME
    var dayRow = -1, dayCol0 = timeCol + 1, nDays = 0;
    for (r = hdrRow; r <= hdrRow + 3; r++) {
      if (num(val(ws, r, timeCol + 1)) === 1 && num(val(ws, r, timeCol + 2)) === 2) {
        dayRow = r; for (c = timeCol + 1; c <= maxC; c++) { if (num(val(ws, r, c)) === nDays + 1) nDays++; else break; }
        break;
      }
    }
    if (dayRow < 0) throw new Error('날짜(1~31) 행을 찾지 못했습니다.');
    var monthLabel = val(ws, hdrRow, dayCol0);

    // summary columns by label
    var S = {};
    for (c = dayCol0 + nDays; c <= maxC; c++) {
      var h2 = norm(val(ws, hdrRow, c));
      if (!h2) continue;
      if (h2.indexOf('기본근무') >= 0) { S.bw = c; S.bo = c + 1; }
      else if (h2.indexOf('평일근무') >= 0) { S.wdTot = c; S.wd15 = c + 1; S.wd2 = c + 2; }
      else if (h2.indexOf('휴일근무') >= 0) { S.hdCnt = c; S.hdTot = c + 1; }
      else if (h2.indexOf('월급여') >= 0) S.pay = c;
      else if (h2.indexOf('기본급') >= 0) S.payBase = c;
      else if (h2.indexOf('평일OT') >= 0) S.payWd = c;
      else if (h2.indexOf('휴일OT') >= 0) S.payHd = c;
      else if (h2.indexOf('보너스') >= 0) S.bonus = c;
    }
    ['bw', 'wdTot', 'hdTot', 'pay'].forEach(function (k) { if (S[k] == null) warnings.push('요약 열 "' + k + '"를 찾지 못했습니다.'); });

    // meta: 근무일 / 휴일 in top rows
    var metaDays = null, metaHol = null;
    for (r = 0; r < hdrRow; r++) for (c = 0; c <= maxC; c++) {
      var m1 = norm(val(ws, r, c));
      if (m1 === '근무일') metaDays = num(val(ws, r, c + 1));
      if (m1 === '휴일') metaHol = num(val(ws, r, c + 1));
    }

    var ym = detectYearMonth(fileName || '', sheetName, monthLabel);

    // workers
    var workers = [];
    var firstHolFormula = null;
    for (r = dayRow + 1; r <= maxR; r++) {
      if (norm(val(ws, r, timeCol)) !== 'IN') continue;
      var rows = { IN: r };
      for (var k = 1; k <= 6 && r + k <= maxR; k++) {
        var lab = norm(val(ws, r + k, timeCol));
        if (lab === 'IN') break;
        if (lab === 'OUT' || lab === 'B/W' || lab === 'B/O' || lab === 'E/O') rows[lab] = r + k;
      }
      var name = val(ws, r, nameCol);
      if (!name) continue;
      var w = {
        no: val(ws, r, 0), id: enCol >= 0 ? String(val(ws, r, enCol) || '') : '', name: String(name).trim(),
        rate: num(val(ws, r, rateCol)), days: [], sheet: {}, formulas: {}
      };
      for (var d = 0; d < nDays; d++) {
        var cc = dayCol0 + d;
        var inv = val(ws, r, cc), outv = rows.OUT != null ? val(ws, rows.OUT, cc) : null;
        var inM = toMin(inv), outM = toMin(outv);
        var note = (inM == null && inv != null && String(inv).trim()) ? String(inv).trim() : '';
        w.days.push({
          d: d + 1, inM: inM, outM: outM, note: note,
          bw: rows['B/W'] != null ? num(val(ws, rows['B/W'], cc)) : 0,
          bo: rows['B/O'] != null ? num(val(ws, rows['B/O'], cc)) : 0,
          eo: rows['E/O'] != null ? num(val(ws, rows['E/O'], cc)) : 0
        });
      }
      Object.keys(S).forEach(function (key) {
        var x = cell(ws, r, S[key]);
        w.sheet[key] = x ? num(x.v) : 0;
        if (x && x.f) w.formulas[key] = x.f;
      });
      if (!firstHolFormula && w.formulas.hdTot) firstHolFormula = w.formulas.hdTot;
      workers.push(w);
    }
    if (!workers.length) throw new Error('작업자(IN 행)를 찾지 못했습니다.');

    // holidays: from 휴일 OT formula columns, else from B/O-blank pattern, else Fridays
    var holSet = {}, holSource = '';
    if (firstHolFormula) {
      var refs = firstHolFormula.replace(/\$/g, '').match(/[A-Z]{1,3}\d+/g) || [];
      refs.forEach(function (ref) { var cI = XLSX.utils.decode_cell(ref).c; var di = cI - dayCol0 + 1; if (di >= 1 && di <= nDays) holSet[di] = true; });
      if (Object.keys(holSet).length) holSource = '휴일 OT 수식에 지정된 날짜';
    }
    // pattern-based detection (for cross-check)
    var patSet = {};
    for (d = 1; d <= nDays; d++) {
      var act = 0, noBo = 0;
      workers.forEach(function (w) { var x = w.days[d - 1]; if (x.bw > 0 || x.eo > 0) { act++; if (!x.bo && x.eo > 0) noBo++; } });
      if (act && noBo / act >= 0.6) patSet[d] = true;
    }
    if (!holSource) {
      if (Object.keys(patSet).length) { holSet = patSet; holSource = 'B/O가 비어 있는 날(자동 감지)'; }
      else if (ym.year && ym.month) { for (d = 1; d <= nDays; d++) if (new Date(ym.year, ym.month - 1, d).getDay() === 5) holSet[d] = true; holSource = '금요일(기본값)'; }
    } else {
      var a = Object.keys(holSet).sort().join(','), b = Object.keys(patSet).sort().join(',');
      if (a !== b) warnings.push('휴일 OT 수식의 휴일(' + Object.keys(holSet).join(', ') + '일)과 B/O가 비어 있는 날(' + (Object.keys(patSet).join(', ') || '없음') + '일)이 다릅니다.');
    }
    var holidays = Object.keys(holSet).map(Number).sort(function (x, y) { return x - y; });
    if (metaHol != null && metaHol !== holidays.length) warnings.push('시트 상단 휴일 수(' + metaHol + ')와 감지된 휴일 수(' + holidays.length + ')가 다릅니다.');

    var month = {
      fileName: fileName, sheetName: sheetName, year: ym.year, month: ym.month, nDays: nDays,
      metaDays: metaDays, metaHol: metaHol, holidays: holidays, holSource: holSource, warnings: warnings, workers: workers
    };
    finishMonth(month);
    return month;
  }


  function finishMonth(month) {
    var hs = {}; month.holidays.forEach(function (d) { hs[d] = true; });
    month.dayInfo = [];
    for (var d = 1; d <= month.nDays; d++) {
      var wd = (month.year && month.month) ? new Date(month.year, month.month - 1, d).getDay() : null;
      month.dayInfo.push({ d: d, wd: wd, wdKo: wd == null ? '' : WD_KO[wd], hol: !!hs[d] });
    }
    month.weekdays = month.nDays - month.holidays.length;
    month.workers.forEach(function (w) { analyzeWorker(w, month); });
    return month;
  }

  // 저장용: 계산 결과(A 등)를 빼고 원자료만 남김
  function serialize(month) {
    return {
      v: 1, fileName: month.fileName, sheetName: month.sheetName, year: month.year, month: month.month, nDays: month.nDays,
      metaDays: month.metaDays, metaHol: month.metaHol, holidays: month.holidays, holSource: month.holSource, warnings: month.warnings,
      workers: month.workers.map(function (w) {
        return { no: w.no, id: w.id, name: w.name, rate: w.rate, sheet: w.sheet, formulas: w.formulas,
          days: w.days.map(function (x) { return { d: x.d, inM: x.inM, outM: x.outM, note: x.note, bw: x.bw, bo: x.bo, eo: x.eo }; }) };
      })
    };
  }
  // 저장된 JSON → 분석 가능한 month (현재 로직으로 다시 계산)
  function hydrate(json, part) {
    var m = JSON.parse(JSON.stringify(json));
    m.warnings = m.warnings || [];
    if (part) { m.part = part; m.workers.forEach(function (w) { w.part = part; }); }
    return finishMonth(m);
  }
  // 여러 파트의 같은 달을 하나로 합침(작업자에 파트 표시). 휴일이 다른 파트는 경고.
  function combine(months, label) {
    if (!months.length) return null;
    var base = months[0];
    var out = { fileName: label || '전체', sheetName: '', year: base.year, month: base.month, nDays: base.nDays,
      holidays: base.holidays.slice(), holSource: base.holSource, warnings: [], workers: [], parts: [] };
    months.forEach(function (m) {
      out.parts.push(m.part);
      if (m.holidays.join(',') !== base.holidays.join(',')) out.warnings.push((m.part || m.fileName) + ' 파트의 휴일(' + m.holidays.join(', ') + '일)이 ' + (base.part || '') + ' 파트와 다릅니다.');
      m.warnings.forEach(function (x) { out.warnings.push((m.part ? '[' + m.part + '] ' : '') + x); });
      m.workers.forEach(function (w) { out.workers.push(w); }); // 이미 각 파트 달력으로 분석된 상태 유지
    });
    out.dayInfo = base.dayInfo; out.weekdays = base.weekdays;
    return out;
  }

  function patternKey(x) { return fmtMin(x.inM) + '–' + fmtMin(x.outM); }

  function distribution(list) {
    var map = {}; list.forEach(function (x) { var k = patternKey(x); map[k] = (map[k] || 0) + 1; });
    var arr = Object.keys(map).map(function (k) { return { key: k, n: map[k] }; });
    arr.sort(function (a, b) { return b.n - a.n; });
    var tot = list.length || 1;
    arr.forEach(function (e) { e.share = e.n / tot; });
    return arr;
  }

  function analyzeWorker(w, month) {
    var hol = {}; month.holidays.forEach(function (d) { hol[d] = true; });
    var A = { wdDays: 0, hdDays: 0, offDays: 0, boSum: 0, eoWd: 0, eoHd: 0, boHd: 0, bwSum: 0, statusNotes: [], gaps: [], wdBoDays: 0, bwMissing: [] };
    var wdList = [], hdList = [];
    w.days.forEach(function (x) {
      x.hol = !!hol[x.d];
      // 휴일에는 B/W 8h가 유급휴일로 일괄 기재되므로 실제 근무는 E/O·B/O로 판단
      var worked = x.hol ? (x.bo > 0 || x.eo > 0) : (x.bw > 0 || x.bo > 0 || x.eo > 0);
      x.ot = x.bo + x.eo;
      x.worked = worked;
      A.bwSum += x.bw;
      if (x.note) A.statusNotes.push({ d: x.d, note: x.note });
      if (!worked) { A.offDays++; return; }
      if (x.hol) { A.hdDays++; A.eoHd += x.eo; A.boHd += x.bo; if (x.inM != null && x.outM != null) hdList.push(x); }
      else { A.wdDays++; if (x.bw > 0 && x.bo > 0) A.wdBoDays++; if (x.bo > 0 && !(x.bw > 0)) A.bwMissing.push(x.d); A.boSum += x.bo; A.eoWd += x.eo; if (x.inM != null && x.outM != null) wdList.push(x); }
      if (x.inM != null && x.outM != null) {
        var span = (x.outM - x.inM + 1440) % 1440 / 60;
        var rec = x.hol ? x.bo + x.eo : x.bw + x.bo + x.eo;
        x.gap = round(span - rec, 2);
        if (x.gap < 0 || x.gap > 3) A.gaps.push({ d: x.d, span: span, rec: rec, gap: x.gap, inM: x.inM, outM: x.outM });
      }
    });
    A.wdDist = distribution(wdList);
    A.hdDist = distribution(hdList);
    A.wdOtGrid = A.boSum + A.eoWd;               // 평일 B/O+E/O 전체 (기본 포함분 포함)
    A.builtinExpected = A.wdBoDays * 2;          // B/W와 B/O가 모두 있는 평일 × 2h (기본급에 포함되는 B/O)
    A.builtinSheet = w.sheet.bo;
    A.wdOtPaid = w.sheet.wdTot;                  // 시트 평일 OT 합계 (기본 포함분 제외)
    A.hdOtPaid = w.sheet.hdTot;
    A.wdOtPerDay = A.wdDays ? A.wdOtPaid / A.wdDays : 0;
    A.hdOtPerDay = A.hdDays ? A.eoHd / A.hdDays : 0;
    // recomputation check
    A.checks = [];
    var expWd15 = A.boSum - A.builtinSheet, expWd2 = A.eoWd;
    if (Math.abs(expWd15 - num(w.sheet.wd15)) > 0.01) A.checks.push('평일 OT 1.5배: 일별 합산 ' + round(expWd15) + 'h ≠ 시트 ' + round(w.sheet.wd15) + 'h');
    if (Math.abs(expWd2 - num(w.sheet.wd2)) > 0.01) A.checks.push('평일 OT 2배: 일별 합산 ' + round(expWd2) + 'h ≠ 시트 ' + round(w.sheet.wd2) + 'h');
    if (Math.abs(A.eoHd + A.boHd - num(w.sheet.hdTot)) > 0.01) A.checks.push('휴일 OT: 일별 합산 ' + round(A.eoHd + A.boHd) + 'h ≠ 시트 ' + round(w.sheet.hdTot) + 'h');
    if (Math.abs(A.builtinExpected - A.builtinSheet) > 0.01) A.checks.push('기본급 포함 B/O: 평일 ' + A.wdBoDays + '일×2h = ' + A.builtinExpected + 'h 이어야 하나 시트는 ' + A.builtinSheet + 'h');
    A.manualAdj = (w.formulas.bo && /\)\s*\*\s*2\s*[-+]\s*\d+/.test(w.formulas.bo)) ? w.formulas.bo : '';
    if (A.bwMissing.length) A.checks.push(A.bwMissing.join(', ') + '일: B/O는 있는데 B/W(기본 8h)가 비어 있음');
    w.A = A;
  }

  function monthLabel(m) { return m.month ? (m.year ? m.year + '년 ' : '') + m.month + '월' : m.fileName; }
  function sum(arr, f) { return arr.reduce(function (s, x) { return s + f(x); }, 0); }

  function teamTotals(m) {
    var ws = m.workers;
    return {
      head: ws.length,
      wdOt: sum(ws, function (w) { return w.sheet.wdTot; }),
      wd15: sum(ws, function (w) { return w.sheet.wd15; }),
      wd2: sum(ws, function (w) { return w.sheet.wd2; }),
      hdOt: sum(ws, function (w) { return w.sheet.hdTot; }),
      payWd: sum(ws, function (w) { return w.sheet.payWd; }),
      payHd: sum(ws, function (w) { return w.sheet.payHd; }),
      payBase: sum(ws, function (w) { return w.sheet.payBase; }),
      pay: sum(ws, function (w) { return w.sheet.pay; }),
      wdPersonDays: sum(ws, function (w) { return w.A.wdDays; }),
      hdPersonDays: sum(ws, function (w) { return w.A.hdDays; })
    };
  }

  function keyOf(w) { return (w.part ? 'p:' + w.part + '|' : '') + (w.id ? 'id:' + w.id : 'nm:' + w.name.toUpperCase()); }

  function compare(m1, m2) {
    var prev = m1, cur = m2;
    if (m1.year && m2.year && m1.month && m2.month && (m1.year * 12 + m1.month) > (m2.year * 12 + m2.month)) { prev = m2; cur = m1; }
    var P = teamTotals(prev), C = teamTotals(cur);
    var map = {};
    prev.workers.forEach(function (w) { map[keyOf(w)] = { p: w }; });
    cur.workers.forEach(function (w) { var k = keyOf(w); (map[k] = map[k] || {}).c = w; });
    var order = [];
    cur.workers.forEach(function (w) { order.push(keyOf(w)); });
    prev.workers.forEach(function (w) { if (order.indexOf(keyOf(w)) < 0) order.push(keyOf(w)); });

    var holDiff = cur.holidays.length - prev.holidays.length;
    var wdDiff = cur.weekdays - prev.weekdays;

    var rows = order.map(function (k) {
      var p = map[k].p, c = map[k].c, w = c || p;
      var row = { key: k, name: w.name, id: w.id, p: p, c: c, tags: [], notes: [] };
      if (!p) { row.status = 'new'; row.tags.push({ t: '신규', s: 'info' }); return row; }
      if (!c) { row.status = 'gone'; row.tags.push({ t: '이번 달 명단 없음', s: 'warn' }); return row; }
      row.status = 'both';
      var pa = p.A, ca = c.A;
      row.dWdOt = c.sheet.wdTot - p.sheet.wdTot;
      row.dHdOt = c.sheet.hdTot - p.sheet.hdTot;
      row.dPayWd = c.sheet.payWd - p.sheet.payWd;
      row.dPayHd = c.sheet.payHd - p.sheet.payHd;
      row.dPay = c.sheet.pay - p.sheet.pay;
      // decomposition: calendar/attendance effect vs pattern effect
      row.wdExpected = pa.wdOtPerDay * ca.wdDays;
      row.wdDaysEffect = row.wdExpected - p.sheet.wdTot;
      row.wdPatternEffect = c.sheet.wdTot - row.wdExpected;
      var pHdPer = pa.hdDays ? p.sheet.hdTot / pa.hdDays : 0;
      row.hdExpected = pHdPer * ca.hdDays;
      row.hdDaysEffect = row.hdExpected - p.sheet.hdTot;
      row.hdPatternEffect = c.sheet.hdTot - row.hdExpected;

      // shift change detection
      row.wdShift = shiftChange(pa.wdDist, ca.wdDist);
      row.hdShift = shiftChange(pa.hdDist, ca.hdDist);
      if (row.wdShift.changed) row.tags.push({ t: '평일 시간대 변경', s: 'alert' });
      if (row.hdShift.changed) row.tags.push({ t: '휴일 시간대 변경', s: 'alert' });
      var perDayDelta = ca.wdOtPerDay - pa.wdOtPerDay;
      row.wdPerDayDelta = perDayDelta;
      if (!row.wdShift.changed && Math.abs(perDayDelta) >= 0.25) row.tags.push({ t: '평일 일평균 OT ' + (perDayDelta > 0 ? '+' : '') + round(perDayDelta, 2) + 'h', s: 'alert' });

      var expectedDays = cur.nDays;
      if (ca.offDays > 0 && (ca.wdDays + ca.hdDays) < expectedDays) row.tags.push({ t: '근무 ' + (ca.wdDays + ca.hdDays) + '/' + expectedDays + '일', s: 'warn' });
      ca.statusNotes.forEach(function (n) { row.notes.push(n.d + '일 "' + n.note + '" 기재'); });
      if (Math.abs(c.rate - p.rate) > 1e-6) row.tags.push({ t: '시급 ' + round(p.rate, 3) + '→' + round(c.rate, 3), s: 'warn' });
      if (ca.checks.length) row.tags.push({ t: '시트 계산 확인 필요', s: 'warn' });
      if (ca.gaps.length) row.tags.push({ t: '출퇴근·시간 불일치 ' + ca.gaps.length + '일', s: 'warn' });
      return row;
    });

    // calendar effect summary for continuing workers
    return {
      prev: prev, cur: cur, P: P, C: C, rows: rows,
      holDiff: holDiff, wdDiff: wdDiff,
      label: { p: monthLabel(prev), c: monthLabel(cur) }
    };
  }

  function shiftChange(pd, cd) {
    var res = { changed: false, pMain: pd[0] || null, cMain: cd[0] || null, moves: [] };
    if (!pd.length || !cd.length) return res;
    var keys = {}; pd.forEach(function (e) { keys[e.key] = 1; }); cd.forEach(function (e) { keys[e.key] = 1; });
    Object.keys(keys).forEach(function (k) {
      var a = pd.filter(function (e) { return e.key === k; })[0], b = cd.filter(function (e) { return e.key === k; })[0];
      var sa = a ? a.share : 0, sb = b ? b.share : 0;
      res.moves.push({ key: k, pn: a ? a.n : 0, cn: b ? b.n : 0, ps: sa, cs: sb, d: sb - sa });
    });
    res.moves.sort(function (x, y) { return Math.abs(y.d) - Math.abs(x.d); });
    if (res.pMain.key !== res.cMain.key) res.changed = true;
    if (res.moves.length && Math.abs(res.moves[0].d) >= 0.15) res.changed = true;
    return res;
  }

  return { parseWorkbook: parseWorkbook, compare: compare, serialize: serialize, hydrate: hydrate, combine: combine, teamTotals: teamTotals, keyOf: keyOf, fmtMin: fmtMin, round: round, monthLabel: monthLabel, WD_KO: WD_KO };
})();

<script>
/* 보고서 화면(인쇄·PDF용)과 엑셀 저장 */
var OTReport = (function () {
  var memo = { author: '', dept: '관리재경팀', opinion: '' };   // 화면을 다시 그려도 입력값 유지
  try { memo.author = localStorage.getItem('tcnot.author') || ''; memo.dept = localStorage.getItem('tcnot.dept') || memo.dept; } catch (e) {}

  function today() { var d = new Date(); return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.'; }
  function fixed(n, d) { return (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }

  function build(r, X) {
    var esc = X.esc, h = X.h, usd = X.usd, sgn = X.sgn, fm = X.fm;
    var P = r.P, C = r.C, both = r.rows.filter(function (x) { return x.status === 'both'; });
    var hrs = function (v) { return h(v) + 'h'; };
    var d0 = function (v) { return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    function dcell(a, b, f) { var d = b - a; return '<td class="n">' + f(a) + '</td><td class="n">' + f(b) + '</td><td class="n ' + (Math.abs(d) < 0.005 ? 'z' : d > 0 ? 'up' : 'dn') + '">' + sgn(d, f) + '</td>'; }
    function pct(a, b) { return a ? sgn((b - a) / a * 100, function (x) { return x.toFixed(1) + '%'; }) : '—'; }

    var title = (X.zone ? X.zone + ' ' : '') + 'OT 월간 비교 보고서';
    var html = '<article class="report" id="report">';

    // 머리글 + 결재란
    html += '<header class="rp-head"><div class="rp-title"><div class="rp-kicker">' + esc(r.label.p) + ' → ' + esc(r.label.c) + '</div><h1>' + esc(title) + '</h1>' +
      '<table class="rp-meta"><tr><th>작성 부서</th><td><span class="ed" contenteditable="true" data-memo="dept">' + esc(memo.dept) + '</span></td><th>작성일</th><td>' + today() + '</td></tr>' +
      '<tr><th>작성자</th><td><span class="ed" contenteditable="true" data-memo="author" data-ph="이름 입력">' + esc(memo.author) + '</span></td><th>대상 인원</th><td>' + P.head + '명 → ' + C.head + '명</td></tr></table></div>' +
      '<table class="rp-sign"><tr><th rowspan="2" class="v">결<br>재</th><th>담당</th><th>검토</th><th>승인</th></tr><tr><td></td><td></td><td></td></tr></table></header>';
    if (X.isSample) html += '<p class="rp-sample">※ 예시 데이터(익명)로 만든 보고서입니다.</p>';

    // 1. 요약
    var F = X.getFindings(r);
    html += '<section><h2>1. 요약</h2><ul class="rp-list">' + F.map(function (f) { return '<li><b class="rp-lab">' + f[0] + '</b> ' + f[1] + '</li>'; }).join('') + '</ul></section>';

    // 2. 근무일 현황
    var hl = function (m) { return m.holidays.map(function (d) { return d + '(' + (m.dayInfo[d - 1].wdKo || '') + ')'; }).join(', '); };
    html += '<section><h2>2. 근무일 현황</h2><table class="rp-t"><thead><tr><th>구분</th><th>' + esc(r.label.p) + '</th><th>' + esc(r.label.c) + '</th><th>증감</th></tr></thead><tbody>' +
      '<tr><td>전체 일수</td>' + dcell(r.prev.nDays, r.cur.nDays, function (v) { return v + '일'; }) + '</tr>' +
      '<tr><td>평일</td>' + dcell(r.prev.weekdays, r.cur.weekdays, function (v) { return v + '일'; }) + '</tr>' +
      '<tr><td>휴일</td>' + dcell(r.prev.holidays.length, r.cur.holidays.length, function (v) { return v + '일'; }) + '</tr>' +
      '<tr><td>휴일 날짜</td><td class="n sm">' + hl(r.prev) + '</td><td class="n sm">' + hl(r.cur) + '</td><td></td></tr>' +
      '<tr><td>기본급 포함 B/O (평일×2h)</td>' + dcell(r.prev.weekdays * 2, r.cur.weekdays * 2, hrs) + '</tr>' +
      '</tbody></table></section>';

    // 3. OT·급여 합계
    var perWd = function (T) { return T.wdPersonDays ? T.wdOt / T.wdPersonDays : 0; }, perHd = function (T) { return T.hdPersonDays ? T.hdOt / T.hdPersonDays : 0; };
    var h2 = function (v) { return fixed(v, 2) + 'h'; };
    function trow(lab, a, b, f) { return '<tr><td>' + lab + '</td>' + dcell(a, b, f) + '<td class="n">' + pct(a, b) + '</td></tr>'; }
    html += '<section><h2>3. OT · 급여 합계</h2><table class="rp-t"><thead><tr><th>항목</th><th>' + esc(r.label.p) + '</th><th>' + esc(r.label.c) + '</th><th>증감</th><th>증감률</th></tr></thead><tbody>' +
      '<tr class="grp"><td colspan="5">평일 OT</td></tr>' +
      trow('평일 OT 시간', P.wdOt, C.wdOt, hrs) + trow('　1.5배 적용', P.wd15, C.wd15, hrs) + trow('　2배 적용', P.wd2, C.wd2, hrs) +
      trow('1인·1일 평균', perWd(P), perWd(C), h2) + trow('평일 OT 금액', P.payWd, C.payWd, d0) +
      '<tr class="grp"><td colspan="5">휴일 OT</td></tr>' +
      trow('휴일 OT 시간', P.hdOt, C.hdOt, hrs) + trow('1인·1회 평균', perHd(P), perHd(C), h2) + trow('휴일 OT 금액', P.payHd, C.payHd, d0) +
      '<tr class="grp"><td colspan="5">급여</td></tr>' +
      trow('기본급', P.payBase, C.payBase, d0) + trow('OT 금액 계', P.payWd + P.payHd, C.payWd + C.payHd, d0) +
      '<tr class="tot"><td>월급여 합계</td>' + dcell(P.pay, C.pay, d0) + '<td class="n">' + pct(P.pay, C.pay) + '</td></tr>' +
      '</tbody></table></section>';

    // 4. 작업자별
    html += '<section><h2>4. 작업자별 OT 증감</h2><table class="rp-t rp-small"><thead><tr><th rowspan="2">No</th><th rowspan="2">성명</th><th colspan="3">평일 OT (h)</th><th colspan="3">휴일 OT (h)</th><th rowspan="2">OT 금액<br>증감</th><th colspan="2">평일 OT 증감 요인</th><th rowspan="2">비고</th></tr>' +
      '<tr><th>전달</th><th>이번 달</th><th>증감</th><th>전달</th><th>이번 달</th><th>증감</th><th>일수</th><th>패턴</th></tr></thead><tbody>';
    var tot = { pw: 0, cw: 0, ph: 0, ch: 0, d$: 0, de: 0, pe: 0 };
    r.rows.forEach(function (x, i) {
      if (x.status !== 'both') {
        var w = x.c || x.p;
        html += '<tr><td class="n">' + (i + 1) + '</td><td>' + esc(w.name) + '</td><td colspan="9" class="sm">' + (x.status === 'new' ? '이번 달 신규' : '이번 달 명단에 없음') + '</td><td class="sm">' + (x.status === 'new' ? '신규' : '제외') + '</td></tr>';
        return;
      }
      var d$ = (x.c.sheet.payWd + x.c.sheet.payHd) - (x.p.sheet.payWd + x.p.sheet.payHd);
      tot.pw += x.p.sheet.wdTot; tot.cw += x.c.sheet.wdTot; tot.ph += x.p.sheet.hdTot; tot.ch += x.c.sheet.hdTot; tot.d$ += d$; tot.de += x.wdDaysEffect; tot.pe += x.wdPatternEffect;
      var note = x.tags.map(function (t) { return t.t; }).concat(x.notes).join(', ');
      html += '<tr' + (x.tags.some(function (t) { return t.s === 'alert'; }) ? ' class="flag"' : '') + '><td class="n">' + (i + 1) + '</td><td>' + esc(x.name) + '</td>' +
        dcell(x.p.sheet.wdTot, x.c.sheet.wdTot, h) + dcell(x.p.sheet.hdTot, x.c.sheet.hdTot, h) +
        '<td class="n">' + sgn(d$, function (v) { return '$' + v.toFixed(2); }) + '</td><td class="n">' + sgn(x.wdDaysEffect, h) + '</td><td class="n">' + sgn(x.wdPatternEffect, h) + '</td><td class="sm">' + esc(note) + '</td></tr>';
    });
    html += '<tr class="tot"><td></td><td>합계</td>' + dcell(tot.pw, tot.cw, h) + dcell(tot.ph, tot.ch, h) + '<td class="n">' + sgn(tot.d$, function (v) { return '$' + v.toFixed(2); }) + '</td><td class="n">' + sgn(tot.de, h) + '</td><td class="n">' + sgn(tot.pe, h) + '</td><td></td></tr>';
    html += '</tbody></table><p class="rp-foot">일수 = 근무일수 효과(전달 1일 평균 OT × 이번 달 근무일수 − 전달 OT), 패턴 = 하루 OT 시간 변화로 생긴 차이. 음영 행은 시간대·OT 패턴이 바뀐 작업자.</p></section>';

    // 5. 근무 시간대 변경
    var sh = both.filter(function (x) { return x.wdShift.changed || x.hdShift.changed || Math.abs(x.wdPerDayDelta) >= 0.25; });
    html += '<section><h2>5. 근무 시간대 변경 내역</h2>';
    if (!sh.length) html += '<p class="rp-p">평일·휴일 출퇴근 시간대가 바뀐 작업자는 없습니다.</p>';
    else {
      html += '<table class="rp-t rp-small"><thead><tr><th>성명</th><th>구분</th><th>' + esc(r.label.p) + ' (출근–퇴근 · 일수)</th><th>' + esc(r.label.c) + ' (출근–퇴근 · 일수)</th><th>1일 평균 평일 OT</th></tr></thead><tbody>';
      sh.forEach(function (x) {
        var dist = function (d) { return d.slice(0, 3).map(function (e) { return e.key + ' · ' + e.n + '일'; }).join('<br>') || '—'; };
        var rows = [['평일', x.p.A.wdDist, x.c.A.wdDist]];
        if (x.hdShift.changed) rows.push(['휴일', x.p.A.hdDist, x.c.A.hdDist]);
        rows.forEach(function (q, k) {
          html += '<tr>' + (k === 0 ? '<td rowspan="' + rows.length + '">' + esc(x.name) + '</td>' : '') + '<td>' + q[0] + '</td><td class="sm mono">' + dist(q[1]) + '</td><td class="sm mono">' + dist(q[2]) + '</td>' +
            (k === 0 ? '<td class="n" rowspan="' + rows.length + '">' + fixed(x.p.A.wdOtPerDay, 2) + 'h → ' + fixed(x.c.A.wdOtPerDay, 2) + 'h<br><span class="' + (x.wdPerDayDelta > 0 ? 'up' : 'dn') + '">' + sgn(x.wdPerDayDelta, function (v) { return v.toFixed(2); }) + 'h</span></td>' : '') + '</tr>';
        });
      });
      html += '</tbody></table>';
    }
    html += '</section>';

    // 6. 확인 필요 사항
    var items = [];
    r.prev.warnings.forEach(function (w) { items.push('[' + r.label.p + '] ' + w); });
    r.cur.warnings.forEach(function (w) { items.push('[' + r.label.c + '] ' + w); });
    both.forEach(function (x) {
      var A = x.c.A, list = A.checks.slice();
      A.gaps.forEach(function (g) { if (A.bwMissing.indexOf(g.d) < 0) list.push(g.d + '일 출퇴근 ' + fm(g.inM) + '–' + fm(g.outM) + '(' + g.span + 'h)인데 기록 합계 ' + g.rec + 'h'); });
      if (A.manualAdj) list.push('기본급 포함 B/O 수식 수동 조정 =' + A.manualAdj + ' → ' + A.builtinSheet + 'h' + (A.builtinExpected === A.builtinSheet ? ' (근무일 기준과 일치)' : ' (근무일 기준 ' + A.builtinExpected + 'h와 불일치)'));
      x.notes.forEach(function (n) { list.push(n); });
      if (Math.abs(x.c.rate - x.p.rate) > 1e-6) list.push('시급 ' + x.p.rate + ' → ' + x.c.rate);
      list.forEach(function (t) { items.push(x.name + ': ' + t); });
    });
    html += '<section><h2>6. 확인 필요 사항</h2>' + (items.length ? '<ul class="rp-list num">' + items.map(function (t, i) { return '<li><span class="k">' + (i + 1) + '.</span><span>' + esc(t) + '</span></li>'; }).join('') + '</ul>' : '<p class="rp-p">시트 계산과 일별 기록에서 이상이 발견되지 않았습니다.</p>') + '</section>';

    // 7. 의견
    html += '<section><h2>7. 검토 의견</h2><div class="ed rp-op" contenteditable="true" data-memo="opinion" data-ph="검토 의견을 입력하세요 (인쇄 시 빈칸이면 줄만 표시됩니다)">' + esc(memo.opinion).replace(/\n/g, '<br>') + '</div></section>';

    html += '<footer class="rp-end"><span>자료: ' + esc(r.prev.fileName) + ' / ' + esc(r.cur.fileName) + '</span><span>휴일 기준: 휴일 OT 수식 지정일 · 평일 OT = B/O − 기본급 포함분 + 평일 E/O</span></footer>';
    return html + '</article>';
  }

  function bind() {
    document.querySelectorAll('#report [data-memo]').forEach(function (el) {
      el.addEventListener('input', function () {
        var k = el.getAttribute('data-memo'); memo[k] = el.innerText.trim();
        try { if (k !== 'opinion') localStorage.setItem('tcnot.' + k, memo[k]); } catch (e) {}
        el.classList.toggle('empty', !memo[k]);
      });
      el.classList.toggle('empty', !el.innerText.trim());
    });
  }

  function toExcel(r, X) {
    if (typeof XLSX === 'undefined') return;
    var wb = XLSX.utils.book_new(), F = X.getFindings(r);
    var strip = function (s) { return String(s).replace(/<br\s*\/?>/g, '\n').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"'); };
    var R2 = function (v) { return Math.round(v * 100) / 100; };
    var P = r.P, C = r.C;
    var sum = [[(X.zone ? X.zone + ' ' : '') + 'OT 월간 비교 보고서'], ['비교 기간', r.label.p + ' → ' + r.label.c], ['작성자', memo.author], ['작성일', today()], [],
      ['요약']].concat(F.map(function (f) { return [f[0], strip(f[1])]; })).concat([[],
      ['항목', r.label.p, r.label.c, '증감'],
      ['평일', r.prev.weekdays, r.cur.weekdays, r.cur.weekdays - r.prev.weekdays],
      ['휴일', r.prev.holidays.length, r.cur.holidays.length, r.cur.holidays.length - r.prev.holidays.length],
      ['평일 OT (h)', P.wdOt, C.wdOt, R2(C.wdOt - P.wdOt)], ['평일 OT 1.5배 (h)', P.wd15, C.wd15, R2(C.wd15 - P.wd15)], ['평일 OT 2배 (h)', P.wd2, C.wd2, R2(C.wd2 - P.wd2)],
      ['평일 OT 금액 ($)', R2(P.payWd), R2(C.payWd), R2(C.payWd - P.payWd)],
      ['휴일 OT (h)', P.hdOt, C.hdOt, R2(C.hdOt - P.hdOt)], ['휴일 OT 금액 ($)', R2(P.payHd), R2(C.payHd), R2(C.payHd - P.payHd)],
      ['기본급 ($)', R2(P.payBase), R2(C.payBase), R2(C.payBase - P.payBase)], ['월급여 합계 ($)', R2(P.pay), R2(C.pay), R2(C.pay - P.pay)], ['인원', P.head, C.head, C.head - P.head]]);
    if (memo.opinion) sum.push([], ['검토 의견', memo.opinion]);
    var ws1 = XLSX.utils.aoa_to_sheet(sum); ws1['!cols'] = [{ wch: 18 }, { wch: 90 }, { wch: 14 }, { wch: 12 }];
    XLSX.utils.book_append_sheet(wb, ws1, '요약');

    var wk = [['No', '사번', '성명', '평일 OT 전달', '평일 OT 이번달', '평일 OT 증감', '휴일 OT 전달', '휴일 OT 이번달', '휴일 OT 증감', 'OT 금액 전달($)', 'OT 금액 이번달($)', 'OT 금액 증감($)', '평일 근무일 전달', '평일 근무일 이번달', '근무일수 효과(h)', '패턴 효과(h)', '평일 주 시간대 전달', '평일 주 시간대 이번달', '비고']];
    r.rows.forEach(function (x, i) {
      var w = x.c || x.p;
      if (x.status !== 'both') { wk.push([i + 1, w.id, w.name, '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', x.status === 'new' ? '이번 달 신규' : '이번 달 명단에 없음']); return; }
      var po = x.p.sheet.payWd + x.p.sheet.payHd, co = x.c.sheet.payWd + x.c.sheet.payHd;
      wk.push([i + 1, w.id, w.name, x.p.sheet.wdTot, x.c.sheet.wdTot, R2(x.dWdOt), x.p.sheet.hdTot, x.c.sheet.hdTot, R2(x.dHdOt), R2(po), R2(co), R2(co - po), x.p.A.wdDays, x.c.A.wdDays, R2(x.wdDaysEffect), R2(x.wdPatternEffect),
        x.wdShift.pMain ? x.wdShift.pMain.key : '', x.wdShift.cMain ? x.wdShift.cMain.key : '', x.tags.map(function (t) { return t.t; }).concat(x.notes).join(', ')]);
    });
    var ws2 = XLSX.utils.aoa_to_sheet(wk); ws2['!cols'] = wk[0].map(function (c, i) { return { wch: i === 2 ? 26 : i >= 16 ? 18 : 12 }; });
    XLSX.utils.book_append_sheet(wb, ws2, '작업자별');

    var chk = [['성명', '내용']];
    r.rows.filter(function (x) { return x.status === 'both'; }).forEach(function (x) {
      var A = x.c.A;
      A.checks.forEach(function (t) { chk.push([x.name, t]); });
      A.gaps.forEach(function (g) { if (A.bwMissing.indexOf(g.d) < 0) chk.push([x.name, g.d + '일 출퇴근 ' + X.fm(g.inM) + '–' + X.fm(g.outM) + '(' + g.span + 'h)인데 기록 합계 ' + g.rec + 'h']); });
      if (A.manualAdj) chk.push([x.name, '기본급 포함 B/O 수식 수동 조정 =' + A.manualAdj]);
      x.notes.forEach(function (n) { chk.push([x.name, n]); });
    });
    var ws3 = XLSX.utils.aoa_to_sheet(chk); ws3['!cols'] = [{ wch: 26 }, { wch: 90 }];
    XLSX.utils.book_append_sheet(wb, ws3, '확인사항');

    var fname = 'OT_Report_' + (r.prev.year || '') + String(r.prev.month || '').padStart(2, '0') + '-' + (r.cur.year || '') + String(r.cur.month || '').padStart(2, '0') + '.xlsx';
    var out = XLSX.write(wb, { type: 'array', bookType: 'xlsx', compression: true });
    var blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  return { build: build, bind: bind, toExcel: toExcel };
})();

</script>
<script>
(function () {
  var R = OTCore.round, fm = OTCore.fmtMin;
  var state = { prev: null, cur: null, isSample: false, effTab: 'wd', view: 'analysis' };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function h(n) { return (Math.round(n * 10) / 10).toLocaleString('en-US', { maximumFractionDigits: 1 }); }
  function usd(n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function sgn(n, f) { var v = Math.abs(n) < 0.005 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '±') + f(Math.abs(v)); }
  function dcls(n) { return Math.abs(n) < 0.005 ? 'd-0' : n > 0 ? 'd-up' : 'd-down'; }
  function pct(a, b) { return a ? ((b - a) / a * 100) : 0; }

  /* ---------- file handling ---------- */
  function readFile(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () {
        try { res(OTCore.parseWorkbook(XLSX.read(new Uint8Array(fr.result), { type: 'array', cellFormula: true }), file.name)); }
        catch (e) { rej(new Error(file.name + ': ' + e.message)); }
      };
      fr.onerror = function () { rej(new Error(file.name + ': 파일을 읽지 못했습니다.')); };
      fr.readAsArrayBuffer(file);
    });
  }
  function ymKey(m) { return m.year && m.month ? m.year * 12 + m.month : null; }
  function showErr(msg) { var e = $('err'); e.textContent = msg; e.hidden = !msg; }

  function setMonths(a, b, isSample) {
    if (a && b && ymKey(a) && ymKey(b) && ymKey(a) > ymKey(b)) { var t = a; a = b; b = t; }
    if (a) state.prev = a; if (b) state.cur = b;
    state.isSample = !!isSample;
    render();
  }
  function handleFiles(list, slot) {
    showErr('');
    var files = Array.prototype.slice.call(list || []).filter(function (f) { return /\.xls[xm]?$/i.test(f.name); });
    if (!files.length) { showErr('엑셀 파일(.xlsx)을 선택해 주세요.'); return; }
    Promise.all(files.slice(0, 2).map(readFile)).then(function (ms) {
      if (slot === 'prev') { state.prev = ms[0]; state.isSample = false; render(); return; }
      if (slot === 'cur') { state.cur = ms[0]; state.isSample = false; render(); return; }
      if (ms.length === 1) {
        // single file: place by month relative to whichever is loaded
        var m = ms[0];
        if (state.cur && ymKey(m) && ymKey(state.cur) && ymKey(m) < ymKey(state.cur)) state.prev = m; else { state.prev = state.cur; state.cur = m; }
        state.isSample = false; render(); return;
      }
      setMonths(ms[0], ms[1], false);
    }).catch(function (e) { showErr(e.message); });
  }
  $('fileBoth').addEventListener('change', function (e) { handleFiles(e.target.files); e.target.value = ''; });
  $('filePrev').addEventListener('change', function (e) { handleFiles(e.target.files, 'prev'); e.target.value = ''; });
  $('fileCur').addEventListener('change', function (e) { handleFiles(e.target.files, 'cur'); e.target.value = ''; });
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { handleFiles(e.dataTransfer.files); });

  /* ---------- tooltip ---------- */
  var tip = $('tip');
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    tip.innerHTML = t.getAttribute('data-tip'); tip.hidden = false;
  });
  document.addEventListener('mousemove', function (e) {
    if (tip.hidden) return;
    var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth, hh = tip.offsetHeight;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 10;
    if (y + hh > window.innerHeight - 8) y = e.clientY - hh - 10;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });

  /* ---------- render ---------- */
  function render() {
    var p = state.prev, c = state.cur;
    $('moPrev').textContent = p ? OTCore.monthLabel(p) : '—';
    $('fnPrev').textContent = p ? p.fileName : '파일 선택';
    $('moCur').textContent = c ? OTCore.monthLabel(c) : '—';
    $('fnCur').textContent = c ? c.fileName : '파일 선택';
    $('sampleFlag').hidden = !state.isSample;
    if (!p || !c) { $('out').innerHTML = '<div class="panel method"><p>두 달 치 타임시트가 모두 있어야 비교할 수 있습니다. 나머지 한 달 파일을 올려 주세요.</p></div>'; return; }
    var r = OTCore.compare(p, c);
    state.r = r;
    var zone = (c.sheetName || '').replace(/_.*$/, '');
    if (zone) $('zoneName').textContent = zone + ' · Time Sheet';
    if (state.view === 'report') { $('out').innerHTML = toolbar('report') + OTReport.build(r, reportCtx()); OTReport.bind(r, reportCtx()); bindToolbar(); window.scrollTo(0, 0); return; }
    $('out').innerHTML = [toolbar('analysis'), secCalendar(r), secTotals(r), secFindings(r), secEffects(r), secShift(r), secWorkers(r), secMethod()].join('');
    bindTabs(); bindToolbar();
  }
  function toolbar(mode) {
    return '<div class="toolbar no-print">' + (mode === 'report'
      ? '<button class="btn ghost" type="button" data-go="analysis">← 분석 화면</button><span class="muted">작성자·의견을 채운 뒤 인쇄하거나 저장하세요</span><span class="tb-right"><button class="btn ghost" type="button" data-go="xlsx">엑셀로 저장</button><button class="btn" type="button" data-go="print">인쇄 / PDF 저장</button></span>'
      : '<span class="muted">' + esc(state.r.label.p) + ' → ' + esc(state.r.label.c) + ' 분석 결과</span><span class="tb-right"><button class="btn ghost" type="button" data-go="xlsx">엑셀로 저장</button><button class="btn" type="button" data-go="report">보고서 보기</button></span>') + '</div>';
  }
  function bindToolbar() {
    document.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () {
        var g = b.getAttribute('data-go');
        if (g === 'report' || g === 'analysis') { state.view = g; render(); window.scrollTo(0, 0); }
        if (g === 'print') window.print();
        if (g === 'xlsx') OTReport.toExcel(state.r, reportCtx());
      });
    });
  }
  function reportCtx() {
    return { zone: ($('zoneName').textContent || '').replace(/\s*·\s*Time Sheet$/, ''), getFindings: getFindings, esc: esc, h: h, usd: usd, sgn: sgn, fm: fm, isSample: state.isSample };
  }

  function miniCal(m) {
    var out = ['일', '월', '화', '수', '목', '금', '토'].map(function (d) { return '<span class="h">' + d + '</span>'; });
    var first = m.dayInfo[0].wd;
    if (first == null) first = 0;

      if (a == null || b == null) return '<div class="w-metric"><span class="lab">' + lab + '</span>' + (b != null ? f(b) : a != null ? f(a) : '—') + '</div>';
      var d = b - a;
      return '<div class="w-metric"><span class="lab">' + lab + '</span><span>' + f(a) + ' → ' + f(b) + '</span><span class="' + dcls(d) + '" style="font-size:.78rem">' + sgn(d, f) + '</span></div>';
    }
    var hrs = function (v) { return h(v) + 'h'; };
    var sum = '<summary><div class="w-name"><span class="caret">›</span><span style="min-width:0">' + esc(x.name) + ' <small>' + esc(x.id) + '</small></span></div>' +
      metric('평일 OT', p && p.sheet.wdTot, c && c.sheet.wdTot, hrs) +
      metric('휴일 OT', p && p.sheet.hdTot, c && c.sheet.hdTot, hrs) +
      metric('급여', p && p.sheet.pay, c && c.sheet.pay, function (v) { return '$' + Math.round(v).toLocaleString('en-US'); }) +
      '<div class="chips">' + tags + '</div></summary>';
    var body = '<div class="w-body">';
    body += '<div class="strip-legend"><span>칸 안 숫자 = 그날 OT(B/O+E/O) 시간</span><span>평일<span class="ramp"><i style="background:var(--b1)"></i><i style="background:var(--b2)"></i><i style="background:var(--b3)"></i><i style="background:var(--b4)"></i><i style="background:var(--b5)"></i></span>적음→많음</span><span>휴일<span class="ramp"><i style="background:var(--o1)"></i><i style="background:var(--o2)"></i><i style="background:var(--o3)"></i><i style="background:var(--o4)"></i></span></span><span><span class="ramp"><i style="outline:2px solid var(--eff-pat);outline-offset:-2px;background:var(--s0)"></i></span>그 달 주 패턴과 다른 시간대</span><span><span class="ramp"><i style="background:repeating-linear-gradient(135deg,var(--s0) 0 3px,var(--rule) 3px 4px)"></i></span>근무 없음</span></div>';
    body += '<div class="strip-wrap"><div class="strip">' + (p ? stripHead(r.prev) + strip(r.prev, p, r.label.p) : '') + '</div></div>';
    body += '<div class="strip-wrap"><div class="strip">' + (c ? stripHead(r.cur) + strip(r.cur, c, r.label.c) : '') + '</div></div>';
    if (p && c) {
      body += '<div class="two-col">' + distBlock('평일 출퇴근 시간대', p.A.wdDist, c.A.wdDist, r.label.p, r.label.c) + distBlock('휴일 출퇴근 시간대', p.A.hdDist, c.A.hdDist, r.label.p, r.label.c) + '</div>';
      body += '<div class="two-col"><div class="decomp"><h3 style="color:var(--ink)">평일 OT 변화 분해</h3>' +
        '<span>근무일 ' + p.A.wdDays + '일 → ' + c.A.wdDays + '일 · 1일 평균 ' + p.A.wdOtPerDay.toFixed(2) + 'h → ' + c.A.wdOtPerDay.toFixed(2) + 'h</span>' +
        '<span>근무일수 효과 <b>' + sgn(x.wdDaysEffect, h) + 'h</b> · 패턴 효과 <b>' + sgn(x.wdPatternEffect, h) + 'h</b> · 합계 <b>' + sgn(x.dWdOt, h) + 'h</b> (' + sgn(x.dPayWd, usd) + ')</span></div>' +
        '<div class="decomp"><h3 style="color:var(--ink)">휴일 OT 변화 분해</h3>' +
        '<span>휴일 근무 ' + p.A.hdDays + '회 → ' + c.A.hdDays + '회 · 1회 평균 ' + p.A.hdOtPerDay.toFixed(2) + 'h → ' + c.A.hdOtPerDay.toFixed(2) + 'h</span>' +
        '<span>근무일수 효과 <b>' + sgn(x.hdDaysEffect, h) + 'h</b> · 패턴 효과 <b>' + sgn(x.hdPatternEffect, h) + 'h</b> · 합계 <b>' + sgn(x.dHdOt, h) + 'h</b> (' + sgn(x.dPayHd, usd) + ')</span></div></div>';
      var items = [];
      x.notes.forEach(function (n) { items.push(esc(n)); });
      c.A.checks.forEach(function (n) { items.push(esc(n)); });
      c.A.gaps.forEach(function (g) { if (c.A.bwMissing.indexOf(g.d) < 0) items.push(g.d + '일: 출퇴근 ' + fm(g.inM) + '–' + fm(g.outM) + '(' + g.span + 'h)인데 기록 합계 ' + g.rec + 'h'); });
      if (c.A.manualAdj) items.push('기본급 포함 B/O 수식이 수동 조정됨: =' + esc(c.A.manualAdj) + ' → ' + c.A.builtinSheet + 'h (B/W·B/O가 모두 있는 평일 ' + c.A.wdBoDays + '일×2h = ' + c.A.builtinExpected + 'h' + (c.A.builtinExpected === c.A.builtinSheet ? ', 일치' : ', 불일치') + ')');
      if (Math.abs(c.rate - p.rate) > 1e-6) items.push('시급 ' + R(p.rate, 4) + ' → ' + R(c.rate, 4));
      if (items.length) body += '<div><h3>확인할 점</h3><ul class="checks">' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul></div>';
    }
    return '<details class="w" id="w-' + esc(x.key).replace(/[^a-z0-9]/gi, '') + '">' + sum + body + '</div></details>';
  }
  function secWorkers(r) {
    return '<section class="block"><div class="sec-head"><h2>작업자별 상세</h2><span class="muted">줄을 누르면 일별 근무표와 시간대 분포가 열립니다</span></div>' +
      '<div class="panel"><div class="w-head"><span>작업자</span><span>평일 OT</span><span>휴일 OT</span><span>월급여</span><span>표시</span></div><div class="workers">' +
      r.rows.map(function (x) { return workerRow(x, r); }).join('') + '</div></div></section>';
  }
  function secMethod() {
    return '<section class="block"><div class="sec-head"><h2>계산 기준</h2></div><div class="panel method"><ul>' +
      '<li>평일 OT = 시트의 "평일근무 OT 합계"(B/O − 기본급 포함분 + 평일 E/O). 휴일 OT = "휴일근무 OT 합계"(휴일 E/O).</li>' +
      '<li>휴일은 휴일 OT 수식(예: =L8+S8+Z8+AG8)에 들어간 날짜로 판단하고, B/O가 비어 있는 날과 다르면 경고합니다.</li>' +
      '<li>휴일에는 B/W 8h가 일괄 기재되므로, 휴일 근무 여부는 E/O 유무로 셉니다.</li>' +
      '<li>근무일수 효과 = 전달 1일 평균 OT × 이번 달 근무일수 − 전달 OT. 패턴 효과 = 나머지(하루 OT 시간 변화).</li>' +
      '<li>시간대 변경 판정: 가장 많은 출퇴근 조합이 바뀌었거나, 한 조합의 비중이 15%p 이상 바뀐 경우. 평일 1일 평균 OT가 0.25h 이상 바뀌면 따로 표시합니다.</li>' +
      '<li>파일은 이 브라우저 안에서만 읽고, 어디에도 업로드하지 않습니다.</li></ul></div></section>';
  }

  /* sample data (js/sample-data.js, 익명화된 예시) */
  function loadSample() {
    showErr('');
    if (typeof SAMPLE_FILES === 'undefined' || !SAMPLE_FILES.length) { showErr('예시 데이터가 없습니다. 타임시트 파일을 올려 주세요.'); return; }
    try {
      var ms = SAMPLE_FILES.map(function (f) {
        var bin = atob(f.b64), u = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        return OTCore.parseWorkbook(XLSX.read(u, { type: 'array', cellFormula: true }), f.name);
      });
      setMonths(ms[0], ms[1], true);
    } catch (e) { showErr('예시 데이터를 읽지 못했습니다: ' + e.message); }
  }
  $('loadSample').addEventListener('click', loadSample);
  if (typeof XLSX === 'undefined') { showErr('엑셀 읽기 라이브러리(SheetJS)를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); return; }
  loadSample();
})();

</script>
</body>
</html>
